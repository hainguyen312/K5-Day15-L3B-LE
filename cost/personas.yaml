# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
# Bản CP3 (Hải): số kiểu người dùng lấy từ spec.md §2 · evidence/summary.md. n phỏng vấn = 3 nên tỉ lệ là tự ước tính.

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # học viên có thể hỏi trợ lý trên Discord của khoá
  low: 436
  base: 700
  high: 1000
  source: "thấp: 436 học viên có hoạt động trên trang pre-class (data/preclass/README.md của repo đề) · cơ sở: lớp L3 hơn 700 học viên (tracks/track-a-edtech.md, mục A5) · cao: khoá K5 hơn 1.000 học viên (tracks/track-a-edtech.md, Bối cảnh)"

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
  - name: chi_nghe_tren_lop
    share: 0.6
    uses_per_month: 1
    turns_per_session: 1
    source: "P1, P2 (2/3 học viên phỏng vấn): 0 lần phải tìm / hỏi lại trong tháng qua, nghe nhắc trên lớp là đủ. share 0.6 và 1 lần / tháng khi có thay đổi: (tự ước tính, n = 3)"
  - name: hoi_khi_thong_tin_doi
    share: 0.3
    uses_per_month: 4
    turns_per_session: 2
    source: "P3: hỏi lại 1 lần ở lần nộp gần nhất + 2–3 lần những ngày đầu (≈ 3–4 lần / tháng); 2 lượt / phiên vì hỏi lại 'cho chắc' (tự ước tính). share 0.3: (tự ước tính, 1/3 học viên phỏng vấn, n = 3)"
  - name: hoi_don_khi_doi_phong
    share: 0.1
    uses_per_month: 8
    turns_per_session: 1
    types: [thuong, kho]
    source: "Discord #chung: 3 lần đổi phòng / giờ sát giờ học trong 11 ngày → ≈ 8 lần / tháng (ngoại suy tuyến tính, tự ước tính); câu D025 hỏi phòng có thêm 3 tin '+1' (evidence/data-mining.md). share 0.1: (tự ước tính)"
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).

prices:             # USD / 1 triệu token — further-reading/model-prices.md của repo đề (BTC tra 25/11/2026). ≥2 mức model
                    # Thêm đúng tên MODEL_NAME đang dùng trong .env nếu khác các dòng dưới, để simulate tính được "thực đo".
  - model: gemini-3.1-flash-lite
    input: 0.25
    output: 1.50
    source: "further-reading/model-prices.md (repo đề) · https://ai.google.dev/gemini-api/docs/pricing · BTC xem 25/11/2026 · tầng Nhỏ"
  - model: gemini-3.5-flash-lite
    input: 0.30
    output: 2.50
    source: "further-reading/model-prices.md (repo đề) · https://ai.google.dev/gemini-api/docs/pricing · BTC xem 25/11/2026 · tầng Nhỏ"
  - model: gemini-4-hydrogen
    input: 1.50
    output: 7.50
    source: "further-reading/model-prices.md (repo đề) · https://ai.google.dev/gemini-api/docs/pricing · BTC xem 25/11/2026 · tầng Lớn"
  - model: gpt-5.4-mini
    input: 0.75
    output: 4.50
    source: "further-reading/model-prices.md (repo đề) · BTC xem 25/11/2026 · giá do Hải ghi trong comment PR #17 · model dùng cho lượt 1–2"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
